{% comment %} Note: Video Embed Block is usually used as it's better for SEO, but this can be used if more customization is needed {% endcomment %}
<div class="video-component section-container-x article-width">
    <figure class="image is-16by9">
        <iframe title="{{ block.value.title }}" class="has-ratio" width="640" height="360" src="{{ block.value.url }}" frameborder="0" allowfullscreen></iframe>
    </figure>
</div>
